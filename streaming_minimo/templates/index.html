<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Streaming simples</title>
</head>
<body>
    <h1>Streaming simples</h1>

    <h2>Buscar vídeos</h2>
    <form onsubmit="buscarVideos(event)">
        <input id="busca-video" placeholder="Título ou descrição">
        <button>Buscar</button>
    </form>
    <div id="videos"></div>
    <button id="anterior-video" onclick="mudarVideos(-1)">Anterior</button>
    <span id="pagina-video"></span>
    <button id="proximo-video" onclick="mudarVideos(1)">Próxima</button>

    <hr>
    <h2>Buscar usuários</h2>
    <form onsubmit="buscarUsuarios(event)">
        <input id="busca-usuario" placeholder="Nome">
        <button>Buscar</button>
    </form>
    <ul id="usuarios"></ul>
    <button id="anterior-usuario" onclick="mudarUsuarios(-1)">Anterior</button>
    <span id="pagina-usuario"></span>
    <button id="proximo-usuario" onclick="mudarUsuarios(1)">Próxima</button>

    <hr>
    <h2>Cadastrar usuário</h2>
    <form onsubmit="cadastrarUsuario(event)">
        <input name="nome" placeholder="Nome" maxlength="100" required>
        <button>Cadastrar</button>
    </form>

    <hr>
    <h2>Publicar vídeo</h2>
    <p>Busque o autor acima para selecioná-lo nesta lista.</p>
    <form onsubmit="publicarVideo(event)">
        <p>
            <label>Autor:
                <select id="autor" name="usuario_id" required></select>
            </label>
        </p>
        <p><label>Título: <input name="titulo" maxlength="150" required></label></p>
        <p><label>Descrição: <textarea name="descricao"></textarea></label></p>
        <p><input type="file" name="video" accept=".mp4,.webm,.ogg" required></p>
        <p>Use MP4, WebM ou OGG com menos de 99 MB.</p>
        <button>Publicar</button>
    </form>

    <template id="modelo-video">
        <article>
            <h3></h3>
            <a></a>
            <p></p>
            <video controls preload="none" width="320"></video>
        </article>
    </template>

    <script src="/static/app.js"></script>
</body>
</html>
